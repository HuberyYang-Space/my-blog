name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

# 不取消进行中的部署:取消可能落在远端脚本删旧、移新之间,留下一个不完整的站点。
# 连续两次 push 时后一次排队等前一次跑完,代价只是多等一轮。
concurrency:
  group: deploy-my-blog
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v2
        with:
          version: 11.15.1
          runtime: node@24
          cache: true
          install: false

      - name: Install CJK fonts for OG image rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium for OG image rendering
        run: pnpm exec playwright-core install --with-deps chromium
        # nuxt-og-image 的 Browser 渲染器用 playwright-core 启动浏览器,在 CI 这种
        # 没有系统 Chrome 可复用的环境下会退回按需下载 Playwright 自己管理的 Chromium,
        # 但这个下载在预渲染请求触发时才发起、不在构建主流程里等待完成,曾实测直接
        # 导致 og:image 渲染 500。显式提前装好,避免这个时序问题。

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - run: tar -czf dist.tar.gz -C .output/public .

      - uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          fingerprint: ${{ secrets.SERVER_HOST_FINGERPRINT }}
          port: 22
          source: dist.tar.gz
          target: /www/wwwroot/my-blog

      - uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          fingerprint: ${{ secrets.SERVER_HOST_FINGERPRINT }}
          port: 22
          script: |
            set -e
            cd /www/wwwroot/my-blog/
            # 先解压到站点内的暂存目录并确认完整,再替换线上文件 —— 包损坏或解压失败时
            # 线上内容不动,而不是先删光再发现解不开。
            rm -rf .release
            mkdir .release
            tar -xzf dist.tar.gz -C .release
            test -f .release/index.html
            # 删旧、移新紧挨着做,访客撞上空站点的窗口只剩这两步之间的毫秒级
            find . -mindepth 1 -maxdepth 1 ! -name .release ! -name dist.tar.gz -exec rm -rf {} +
            find .release -mindepth 1 -maxdepth 1 -exec mv {} . \;
            rmdir .release
            rm dist.tar.gz
