name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-my-blog
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/setup@v1
        with:
          version: 11.15.1
          runtime: node@24
          cache: true
          install: false

      - name: Install CJK fonts for OG image rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium for OG image rendering
        run: pnpm exec playwright-core install --with-deps chromium
        # nuxt-og-image 的 Browser 渲染器用 playwright-core 启动浏览器,在 CI 这种
        # 没有系统 Chrome 可复用的环境下会退回按需下载 Playwright 自己管理的 Chromium,
        # 但这个下载在预渲染请求触发时才发起、不在构建主流程里等待完成,曾实测直接
        # 导致 og:image 渲染 500。显式提前装好,避免这个时序问题。

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - run: tar -czf dist.tar.gz -C .output/public .

      - uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          fingerprint: ${{ secrets.SERVER_HOST_FINGERPRINT }}
          port: 22
          source: dist.tar.gz
          target: /www/wwwroot/my-blog

      - uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          fingerprint: ${{ secrets.SERVER_HOST_FINGERPRINT }}
          port: 22
          script: |
            cd /www/wwwroot/my-blog/ || exit 1
            find . -mindepth 1 ! -name 'dist.tar.gz' -exec rm -rf {} +
            tar -xzf dist.tar.gz
            rm dist.tar.gz
