name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      operation:
        description: 部署或搜索通知操作
        type: choice
        default: deploy
        options: [deploy, initialize-search, submit-search, backfill-baidu]
      engine:
        description: 搜索平台（历史补推仅支持百度）
        type: choice
        default: all
        options: [all, baidu, indexnow]

permissions:
  contents: read
  actions: read

# 不取消进行中的部署:取消可能落在远端脚本删旧、移新之间,留下一个不完整的站点。
# 连续两次 push 时后一次排队等前一次跑完,代价只是多等一轮。
concurrency:
  group: deploy-my-blog
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.operation == 'deploy')
    runs-on: ubuntu-latest
    env:
      GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
      BAIDU_SITE_VERIFICATION: ${{ vars.BAIDU_SITE_VERIFICATION }}
      BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}
      INDEXNOW_SUBMISSION_ENABLED: ${{ vars.INDEXNOW_SUBMISSION_ENABLED }}
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v2
        with:
          version: 11.15.1
          runtime: node@24
          cache: true
          install: false

      - name: Install CJK fonts for OG image rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium for OG image rendering
        run: pnpm exec playwright-core install --with-deps chromium
        # nuxt-og-image 的 Browser 渲染器用 playwright-core 启动浏览器,在 CI 这种
        # 没有系统 Chrome 可复用的环境下会退回按需下载 Playwright 自己管理的 Chromium,
        # 但这个下载在预渲染请求触发时才发起、不在构建主流程里等待完成,曾实测直接
        # 导致 og:image 渲染 500。显式提前装好,避免这个时序问题。

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - run: tar -czf dist.tar.gz -C .output/public .

      - uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          fingerprint: ${{ secrets.SERVER_HOST_FINGERPRINT }}
          port: 22
          source: dist.tar.gz
          target: /www/wwwroot/my-blog

      - uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          fingerprint: ${{ secrets.SERVER_HOST_FINGERPRINT }}
          port: 22
          script: |
            set -e
            cd /www/wwwroot/my-blog/
            # 先解压到站点内的暂存目录并确认完整,再替换线上文件 —— 包损坏或解压失败时
            # 线上内容不动,而不是先删光再发现解不开。
            rm -rf .release
            mkdir .release
            tar -xzf dist.tar.gz -C .release
            test -f .release/index.html
            # 删旧、移新紧挨着做,访客撞上空站点的窗口只剩这两步之间的毫秒级
            find . -mindepth 1 -maxdepth 1 ! -name .release ! -name dist.tar.gz -exec rm -rf {} +
            find .release -mindepth 1 -maxdepth 1 -exec mv {} . \;
            rmdir .release
            rm dist.tar.gz

      - name: Save deployed search snapshot
        uses: actions/upload-artifact@v7.0.2
        with:
          name: search-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: .output/search/snapshot.json
          if-no-files-found: error
          retention-days: 90

  search:
    needs: deploy
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (needs.deploy.result == 'success' ||
       (github.event_name == 'workflow_dispatch' &&
        contains(fromJSON('["initialize-search","submit-search","backfill-baidu"]'), inputs.operation)))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BAIDU_SUBMISSION_ENABLED: ${{ vars.BAIDU_SUBMISSION_ENABLED }}
      INDEXNOW_SUBMISSION_ENABLED: ${{ vars.INDEXNOW_SUBMISSION_ENABLED }}
      SEARCH_OPERATION: ${{ inputs.operation || 'deploy' }}
      SEARCH_ENGINE: ${{ inputs.engine || 'all' }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v2
        with:
          version: 11.15.1
          runtime: node@24
          cache: true
          install: false

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Restore deployed snapshot and platform states
        run: |
          args=(--snapshot --engine "$SEARCH_ENGINE")
          if [ "$SEARCH_OPERATION" = initialize-search ]; then args+=(--initialize); fi
          pnpm search:restore "${args[@]}"

      - name: Notify search engines
        env:
          BAIDU_API_ENDPOINT: ${{ secrets.BAIDU_API_ENDPOINT }}
          BAIDU_ALLOW_HTTP: ${{ vars.BAIDU_ALLOW_HTTP }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          args=(--snapshot .search/snapshot.json --state .search/state.json --engine "$SEARCH_ENGINE")
          case "$SEARCH_OPERATION" in
            initialize-search) args+=(--mode initialize) ;;
            backfill-baidu) args+=(--mode backfill-baidu) ;;
            deploy) args+=(--mode submit --allow-disabled) ;;
            submit-search) args+=(--mode submit) ;;
          esac
          pnpm search:submit "${args[@]}"

      - name: Save Baidu state even after a partial failure
        if: always() && hashFiles('.search/results/baidu/state.json') != ''
        uses: actions/upload-artifact@v7.0.2
        with:
          name: search-state-baidu-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .search/results/baidu/state.json
            .search/results/baidu/removed.txt
          if-no-files-found: error
          retention-days: 90

      - name: Save IndexNow state even after a partial failure
        if: always() && hashFiles('.search/results/indexnow/state.json') != ''
        uses: actions/upload-artifact@v7.0.2
        with:
          name: search-state-indexnow-${{ github.run_id }}-${{ github.run_attempt }}
          path: .search/results/indexnow/state.json
          if-no-files-found: error
          retention-days: 90

      - name: Summarize search notifications
        if: always()
        run: |
          if [ -f .search/results/summary.txt ]; then
            cat .search/results/summary.txt >> "$GITHUB_STEP_SUMMARY"
          else
            echo '搜索通知未执行，请查看产物恢复或配置步骤。' >> "$GITHUB_STEP_SUMMARY"
          fi
