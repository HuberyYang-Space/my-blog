minimumReleaseAgeExclude:
  - framer-motion@12.43.0
  - motion-dom@12.43.0
  - motion@12.43.0
shellEmulator: true

trustPolicy: no-downgrade

# semver@6.3.1 是 @babel/core 等包的传递依赖(babel 内部固定 ^6.0.0)。
# no-downgrade 策略把它误判为 "trust downgrade / possible package takeover",
# 但已核对:lockfile integrity 与 npm registry 完全一致,维护者为官方 npm CLI 团队,
# 且 6.3.1 本身是修复 ReDoS(CVE-2022-25883)后的版本。故仅对该条目豁免。
# chokidar@4.0.3 是 @astrojs/check 的传递依赖。同样为误报:
# 该版本 2024-12-18 发布至今无异常,维护者 paulmillr 为唯一且长期维护者,
# integrity 与 registry 一致,仅因缺 provenance 附证被判定为 trust downgrade。
# mdn-data@2.29.0 报的是 "Missing time in metadata",并非 trust downgrade:
# pnpm 取到的精简元数据缺 time 字段,实际 registry 有时间戳(2026-07-17),
# 由 Mozilla mdn-bot 经 GitHub Actions 发布,且是当前 latest。
trustPolicyExclude:
  - semver@6.3.1
  - chokidar@4.0.3
  - mdn-data@2.29.0

allowBuilds:
  esbuild: true
  sharp: true
