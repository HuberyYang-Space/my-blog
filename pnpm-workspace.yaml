minimumReleaseAgeExclude:
  - framer-motion@12.43.0
  - motion-dom@12.43.0
  - motion@12.43.0
shellEmulator: true

# pnpm 默认会在 pnpm exec/run 之前检查依赖是否与 lockfile 同步,不同步就自行跑一次 install。
# 关掉它:依赖同步是人的职责,不该由 pre-commit 钩子代劳 —— 钩子会在 GitHub Desktop 这类
# 无 TTY 的环境里运行,一旦那次 install 需要交互确认(例如它判定 node_modules 过期、要删掉重建),
# 就直接失败退出,而报错指向 pnpm 内部调用栈,完全看不出跟"提交"有什么关系。
verifyDepsBeforeRun: false

trustPolicy: no-downgrade

# semver@6.3.1 是 @babel/core 等包的传递依赖(babel 内部固定 ^6.0.0)。
# no-downgrade 策略把它误判为 "trust downgrade / possible package takeover",
# 但已核对:lockfile integrity 与 npm registry 完全一致,维护者为官方 npm CLI 团队,
# 且 6.3.1 本身是修复 ReDoS(CVE-2022-25883)后的版本。故仅对该条目豁免。
# mdn-data@2.29.0 报的是 "Missing time in metadata",并非 trust downgrade:
# pnpm 取到的精简元数据缺 time 字段,实际 registry 有时间戳(2026-07-17),
# 由 Mozilla mdn-bot 经 GitHub Actions 发布,且是当前 latest。
# undici-types@6.21.0 是 @types/node 全部 22.x 版本固定依赖的传递包(dependencies
# 里写死 "~6.21.0",22.x 线上没有更高的 6.21.x 补丁版可换)。核对结果:该版本发布于
# 2024-11-13,早于这个包开始接入 npm provenance 的时间点(6.23.0 起才有 attestation,
# 2026-01 才发布);6.21.0 之后再也没有发布过,历史版本不可能补发 attestation。
# 维护者(matteo.collina / ethan_arrowood)与更高版本一致、未变更,lockfile integrity
# 与 registry 核对一致。判定为 provenance 覆盖率随时间推进导致的误报,非供应链劫持。
trustPolicyExclude:
  - semver@6.3.1
  - mdn-data@2.29.0
  - undici-types@6.21.0

# better-sqlite3 是 @nuxt/content v3 的存储后端(v3 把内容层从文件改为 SQL),
# 属原生模块,安装时需跑 prebuild-install 拉预编译二进制、失败则回落 node-gyp 编译。
# 放行理由:它是 @nuxt/content 官方文档指定的默认适配器,维护者为 WiseLibs 组织,
# 长期活跃;构建脚本只做二进制获取/编译,不访问项目文件。
allowBuilds:
  better-sqlite3: true
  esbuild: true
  sharp: true
